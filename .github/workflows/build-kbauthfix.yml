name: Build KBAuthFix Xposed module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed APK
        run: bash kbauthfix/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBAuthFix
          path: kbauthfix/KBAuthFix.apk
          if-no-files-found: error
          retention-days: 30
