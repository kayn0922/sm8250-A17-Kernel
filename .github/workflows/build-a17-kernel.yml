name: Build A17 Kernel (SukiSU)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Hardware codename (elish=Pad5Pro WiFi / enuma=5G / dagu=12.4)'
        required: true
        default: 'enuma'
        type: choice
        options: [elish, enuma, dagu]
      ksu:
        description: 'Root solution'
        required: true
        default: 'ksu'
        type: choice
        options: [ksu, rksu, noksu]
      target_system:
        description: 'MIUI/HyperOS MUST use miui (AOSP build blackscreens on HyperOS)'
        required: true
        default: 'miui'
        type: choice
        options: [miui, aosp, both]
      gps_dts_fix:
        description: 'Experimental: inject a minimal bcm4775 GPS node into dagu DTS'
        required: true
        default: 'none'
        type: choice
        options: [none, dagu-minimal-node]
      build_mode:
        description: 'stable = 0001/0002/0003 ON + guard OFF; clean = ALL patches OFF + guard OFF; guard = patches ON + wakelock guard ON (verified daily driver); capture = patches OFF + debug ON; bisect = clean/capture base + external SDX55M stack OFF; spifix = clean + spi_geni fix; spifix1 = spifix + 0001 GNSS fix; spifix2 = spifix1 + geni-serial noirq fix; spifix3 = spifix2 + force runtime suspend/resume of both GENI devices; spifix4 = spifix3 + shallow WFI suspend (skip vendor SoC power collapse); nvtfix = spi_geni force-rpm + NVT suspend gesture-disable (no geni-serial noirq change); nvtfix2 = nvtfix + geni-serial noirq fix (998000.qup_uart -EBUSY); nvtfix3 = nvtfix2 + pogo keyboard CONFIG off (did not stick); nvtfix4 = nvtfix2 + pogo keyboard probe forcibly ENODEV; nvtfix5 = nvtfix4 + 0002 charger-watchdog + 0003 cgroup-freezer root fixes restored (USG_CLEAN=0); rebindfix = guard base + NVT proc-node unbind/rebind crash fix (tp_lockdown_info leak + UAF NULL guards) for screen-off unbind / screen-on rebind'
        required: true
        default: 'stable'
        type: choice
        options: [stable, clean, guard, capture, bisect, spifix, spifix1, spifix2, spifix3, spifix4, nvtfix, nvtfix2, nvtfix3, nvtfix4, nvtfix5, rebindfix]

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.device }} / ${{ inputs.ksu }} / ${{ inputs.target_system }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout this builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout upstream kernel source
        uses: actions/checkout@v4
        with:
          repository: ymdzq/kernel_xiaomi_sm8250_mod
          ref: android16-aptusitu
          fetch-depth: 1
          path: kernel

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup ZyC-Clang 22
        run: |
          mkdir -p "$HOME/ZyC-clang" && cd "$HOME/ZyC-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250924-release/Clang-22.0.0git-20250924.tar.gz
          tar -zxvf Clang-22.0.0git-20250924.tar.gz
          ls "$HOME/ZyC-clang/bin/clang" && "$HOME/ZyC-clang/bin/clang" --version | head -2

      - name: Apply A17 compatibility + GPS kernel-side patches
        env:
          # stable (default): guard OFF + watchdog root-fix ON -> native deep
          #   sleep, zero extra power, reboot gone. This is the daily-driver build.
          # capture: guard OFF + debug ON + watchdog fix OFF -> the real bug
          #   still fires so it can be observed/captured by ramoops/netconsole.
          # bisect = clean (stock SSR/charger/freezer, no guard) + capture
          # (PM_SLEEP_DEBUG / netconsole / ramoops / panic-on-oops so pm_test
          # can localise the failing suspend stage) + USG_BISECT (external
          # SDX55M stack OFF). One build answers BOTH open questions:
          #   no reboot  -> the ESOC stack was the regression
          #   still reboot-> run /sys/power/pm_test with netconsole to find
          #                  which suspend stage resets the SoC
          # spifix = verified root fix: pm_test on a clean (no guard, no
          # 0001/0002/0003) kernel showed spi_geni_suspend() returning -EBUSY
          # for 990000.spi (runtime PM active because of the NVT-ts touch panel
          # + pogo keyboard IRQ storm), which aborts every system suspend.
          USG_CAPTURE: ${{ (inputs.build_mode == 'capture' || inputs.build_mode == 'bisect') && '1' || '' }}
          USG_CLEAN: ${{ (inputs.build_mode == 'clean' || inputs.build_mode == 'bisect' || inputs.build_mode == 'spifix' || inputs.build_mode == 'spifix1' || inputs.build_mode == 'spifix2' || inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4'))) && '1' || '' }}
          USG_DISABLE: ${{ (inputs.build_mode == 'stable' || inputs.build_mode == 'clean' || inputs.build_mode == 'bisect' || inputs.build_mode == 'spifix' || inputs.build_mode == 'spifix1' || inputs.build_mode == 'spifix2' || inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_BISECT: ${{ inputs.build_mode == 'bisect' && '1' || '' }}
          USG_SPIFIX: ${{ (inputs.build_mode == 'spifix' || inputs.build_mode == 'spifix1' || inputs.build_mode == 'spifix2' || inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_KEEP_0001: ${{ (inputs.build_mode == 'spifix1' || inputs.build_mode == 'spifix2' || inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_GENI_SERIAL_FIX: ${{ (inputs.build_mode == 'spifix2' || inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_FORCE_RPM: ${{ (inputs.build_mode == 'spifix3' || inputs.build_mode == 'spifix4' || inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_SHALLOW: ${{ inputs.build_mode == 'spifix4' && '1' || '' }}
          USG_NVTFIX: ${{ (inputs.build_mode == 'nvtfix' || (inputs.build_mode == 'nvtfix2' || (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5'))) && '1' || '' }}
          USG_NOKBD: ${{ (inputs.build_mode == 'nvtfix3' || inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5') && '1' || '' }}
          USG_NOKBD2: ${{ (inputs.build_mode == 'nvtfix4' || inputs.build_mode == 'nvtfix5') && '1' || '' }}
          USG_REBINDFIX: ${{ inputs.build_mode == 'rebindfix' && '1' || '' }}
        run: |
          bash builder/scripts/apply_patches.sh kernel "${{ inputs.device }}" "${{ inputs.gps_dts_fix }}"

      - name: Build kernel
        working-directory: kernel
        run: |
          chmod +x build.sh
          case "${{ inputs.target_system }}" in
            miui) bash build.sh "${{ inputs.device }}" "${{ inputs.ksu }}" miui ;;
            aosp) bash build.sh "${{ inputs.device }}" "${{ inputs.ksu }}" aosp ;;
            both) bash build.sh "${{ inputs.device }}" "${{ inputs.ksu }}" ;;
          esac

      - name: Collect flashable zips
        run: |
          mkdir -p artifacts
          find kernel -maxdepth 1 -name 'Kernel_*.zip' -print -exec cp {} artifacts/ \;
          ls -lh artifacts/
          test -n "$(ls -A artifacts/)" || { echo 'No kernel zip produced'; exit 1; }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_id }}
          name: ${{ inputs.device }} / ${{ inputs.ksu }} / ${{ inputs.target_system }} / run ${{ github.run_id }}
          body: |
            Built from `ymdzq/kernel_xiaomi_sm8250_mod@android16-aptusitu`.
            - device: `${{ inputs.device }}`
            - root: `${{ inputs.ksu }}` (ksu = ReSukiSU + SuSFS + KPM)
            - target: `${{ inputs.target_system }}`
            - build_mode: `${{ inputs.build_mode }}`
            - gps_dts_fix: `${{ inputs.gps_dts_fix }}`

            **HyperOS / OS4 users: flash `Kernel_MIUI_*.zip` only.** AOSP builds blackscreen on HyperOS.
            The zip does NOT contain dtbo.img. Keep your stock dtbo. See GPS_DIAGNOSIS.md before flashing.
          files: artifacts/*.zip
