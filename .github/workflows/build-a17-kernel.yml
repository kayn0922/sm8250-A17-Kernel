name: Build A17 Kernel (SukiSU)

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Devices to build in parallel (one job + one Release per codename)'
        required: true
        default: 'elish+enuma'
        type: choice
        options: [elish+enuma, elish, enuma, elish+enuma+dagu]
      ksu:
        description: 'Root solution'
        required: true
        default: 'ksu'
        type: choice
        options: [ksu, rksu, noksu]
      target_system:
        description: 'MIUI/HyperOS MUST use miui (AOSP build blackscreens on HyperOS)'
        required: true
        default: 'miui'
        type: choice
        options: [miui, aosp, both]
      stability_fixes:
        description: 'Apply keyboard panic / cgroup / pstore fixes (false = A/B control build)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      gps_dts_fix:
        description: 'Experimental: inject a minimal bcm4775 GPS node into dagu DTS'
        required: true
        default: 'none'
        type: choice
        options: [none, dagu-minimal-node]

permissions:
  contents: write

jobs:
  plan:
    name: Resolve device matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set.outputs.devices }}
    steps:
      - id: set
        run: |
          case "${{ inputs.devices }}" in
            elish)             echo 'devices=["elish"]'                    >> "$GITHUB_OUTPUT" ;;
            enuma)             echo 'devices=["enuma"]'                    >> "$GITHUB_OUTPUT" ;;
            elish+enuma+dagu)  echo 'devices=["elish","enuma","dagu"]'    >> "$GITHUB_OUTPUT" ;;
            *)                 echo 'devices=["elish","enuma"]'            >> "$GITHUB_OUTPUT" ;;
          esac
          echo "building: $(cat "$GITHUB_OUTPUT")"

  build:
    needs: plan
    name: ${{ matrix.device }} / ${{ inputs.ksu }} / ${{ inputs.target_system }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}

    steps:
      - name: Checkout this builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout upstream kernel source
        uses: actions/checkout@v4
        with:
          repository: ymdzq/kernel_xiaomi_sm8250_mod
          ref: android16-aptusitu
          fetch-depth: 1
          path: kernel

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup ZyC-Clang 22
        run: |
          mkdir -p "$HOME/ZyC-clang" && cd "$HOME/ZyC-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250924-release/Clang-22.0.0git-20250924.tar.gz
          tar -zxvf Clang-22.0.0git-20250924.tar.gz
          ls "$HOME/ZyC-clang/bin/clang" && "$HOME/ZyC-clang/bin/clang" --version | head -2

      - name: Normalize builder line endings (CRLF guard)
        run: |
          find builder -type f \( -name '*.sh' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.txt' \) -exec sed -i 's/\r$//' {} +
          if grep -rl $'\r' builder/scripts builder/.github; then
            echo 'CRLF still present in builder scripts'; exit 1
          fi
          echo 'builder scripts are LF'

      - name: Apply A17 compatibility + GPS kernel-side patches
        run: |
          bash builder/scripts/apply_patches.sh kernel "${{ matrix.device }}" "${{ inputs.gps_dts_fix }}"

      - name: Apply stability fixes (keyboard panic / cgroup / pstore)
        if: inputs.stability_fixes == 'true'
        run: |
          mkdir -p artifacts
          LOG="artifacts/STABILITY_FIXES_${{ matrix.device }}.txt"
          {
            echo "device=${{ matrix.device }}"
            echo "stability_fixes=${{ inputs.stability_fixes }}"
            echo "--- apply ---"
            python3 builder/scripts/apply_stability_fixes.py \
              --kernel-dir kernel --devices "${{ matrix.device }}"
            echo "--- verify ---"
            python3 builder/scripts/apply_stability_fixes.py \
              --kernel-dir kernel --devices "${{ matrix.device }}" --check
          } 2>&1 | tee "$LOG"
          grep -q 'all stability fixes verified' "$LOG"

      - name: Build kernel
        working-directory: kernel
        run: |
          chmod +x build.sh
          case "${{ inputs.target_system }}" in
            miui) bash build.sh "${{ matrix.device }}" "${{ inputs.ksu }}" miui ;;
            aosp) bash build.sh "${{ matrix.device }}" "${{ inputs.ksu }}" aosp ;;
            both) bash build.sh "${{ matrix.device }}" "${{ inputs.ksu }}" ;;
          esac

      - name: Collect flashable zips
        run: |
          mkdir -p artifacts
          find kernel -maxdepth 1 -name 'Kernel_*.zip' -print -exec cp {} artifacts/ \;
          ls -lh artifacts/
          test -n "$(ls -A artifacts/)" || { echo 'No kernel zip produced'; exit 1; }
          ls artifacts/Kernel_*.zip >/dev/null || { echo 'No Kernel_*.zip produced'; exit 1; }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_id }}-${{ matrix.device }}
          name: ${{ matrix.device }} / ${{ inputs.ksu }} / ${{ inputs.target_system }} / run ${{ github.run_id }}
          body: |
            Built from `ymdzq/kernel_xiaomi_sm8250_mod@android16-aptusitu`.
            - device: `${{ matrix.device }}`
            - root: `${{ inputs.ksu }}` (ksu = ReSukiSU + SuSFS + KPM)
            - target: `${{ inputs.target_system }}`
            - stability_fixes: `${{ inputs.stability_fixes }}`
            - gps_dts_fix: `${{ inputs.gps_dts_fix }}`

            `STABILITY_FIXES_*.txt` records the patch verification for this build.
            Patches: xiaomi_keyboard notifier teardown (kernel panic after keyboard
            reset), CONFIG_CGROUP_PIDS/DEVICE (A17 memcg), ramoops record_size
            (pstore panic logs). They only fix kernel-side issues; the framework
            soft-restarts caused by LSPosed/Thanox hooks still need those modules
            disabled.

            **HyperOS / OS4 users: flash `Kernel_MIUI_*.zip` only.** AOSP builds
            blackscreen on HyperOS. The zip does NOT contain dtbo.img; keep your
            stock dtbo. Flash only the zip matching your hardware codename.
          files: artifacts/*
